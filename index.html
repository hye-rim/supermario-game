<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>슈퍼마리오</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:38px; font-weight:900; letter-spacing:.02em; color:#ff5a3a; text-shadow:0 3px 0 #7a1a0a; }
  #overlay h2 { font-size:26px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay p b { color:#ffd23a; font-weight:700; }
  #overlay .big { font-size:30px; font-weight:900; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#ffd9a8,#ff6a3a); color:#3a0a00; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #8a2a0a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #8a2a0a; }
  #overlay .stages { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  #overlay .stages button { margin:0; padding:7px 12px; font-size:13px; white-space:nowrap; background:#fff; box-shadow:0 3px 0 #999; }
  #overlay .stages button:disabled { opacity:.35; box-shadow:none; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 폰 조작판: 왼쪽 ◀ ▶ · 오른쪽 B(달리기·불꽃)와 A(점프). 점프는 누르고 있을수록 높이 뛴다 */
  #controls { display:none; width:100%; justify-content:space-between; align-items:center; padding:0 12px; gap:12px; }
  #pad { display:flex; gap:7px; }
  #pad button, #acts button { border-radius:20px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.85); font-size:26px; touch-action:none; height:84px; }
  #pad button { width:58px; font-size:22px; }
  #acts { display:flex; gap:7px; }
  #acts button { width:66px; font-size:15px; font-weight:900; line-height:1.25; }
  #jumpBt { background:rgba(255,106,58,.3) !important; border-color:rgba(255,150,100,.55) !important; height:104px !important; }
  #pad button.on, #acts button.on { background:rgba(255,210,58,.45) !important; color:#fff; transform:scale(.95); }
  #overlay button.opt { margin:0; padding:7px 16px; font-size:13px; background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.3); }
  #overlay button.opt.on { background:rgba(255,210,58,.5); border-color:#ffd23a; }
  #pad { touch-action:none; padding:0; }
  /* 가로 화면(폰): 왼쪽 방향판 · 가운데 게임 · 오른쪽 점프·불꽃. 화면이 훨씬 커진다 */
  @media (pointer:coarse) and (orientation:landscape) {
    #stage { flex-direction:row; gap:8px; padding:4px 8px; }
    #stage > #controls { display:contents; }
    #pad { order:0; flex-shrink:0; gap:5px; }
    #wrap { order:1; flex-shrink:0; }
    #acts { order:2; flex-shrink:0; gap:5px; }
    #pad button, #acts button { height:72px; border-radius:16px; }
    #pad button { width:46px; font-size:20px; }
    #acts button { width:54px; font-size:13px; }
    #jumpBt { height:92px !important; }
  }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>슈퍼마리오</h1>
      <p>달리고 뛰어서 <b>깃대</b>까지 가요! 🏁<br>굼바는 <b>밟고</b>, ? 블록은 <b>머리로 쳐요</b><br>코스는 모두 10개예요 (마지막은 쿠파!)</p>
      <div class="help">
        <span class="pc">⌨️ ← → 걷기 · ↓ 앉기·파이프 들어가기 · 스페이스(Z) 점프(오래 누르면 높이) · X(Shift) 달리기·불꽃 · P 일시정지 · M 소리</span>
        <span class="touch">👆 ◀ ▶ 걷기(밀어서 방향 바꿈) · ▼ 앉기·파이프 · 점프 · 달리기·불꽃</span>
      </div>
      <button id="startBtn">시작하기</button>
      <button class="opt" data-act="auto">🏃 자동 달리기</button>
      <div class="stages" id="stages"></div>
    </div>
  </div>
  <div id="controls">
    <div id="pad"><button id="leftBt">◀</button><button id="downBt">▼</button><button id="rightBt">▶</button></div>
    <div id="acts"><button id="runBt">달리기<br>불꽃</button><button id="jumpBt">점프</button></div>
  </div>
</div>
<script src="levels.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
